<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asetek Lab System - Login</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon/favicon.ico') }}" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .login-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            padding: 3rem;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
        }
        .login-logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-logo h1 {
            color: #333;
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }
        .login-logo p {
            color: #666;
            margin: 0;
        }
        .microsoft-btn {
            background: #0078d4;
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .microsoft-btn:hover {
            background: #106ebe;
        }
        .microsoft-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            border: 1px solid #f1aeb5;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
    <!-- MSAL.js -->
    <script src="https://alcdn.msauth.net/browser/2.38.2/js/msal-browser.min.js"></script>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <h1><i class="fas fa-flask"></i> Asetek</h1>
                <p>Laboratory Management System</p>
            </div>
            
            <div id="error-message" class="error-message" style="display: none;"></div>
            
            <div id="redirect-uri-info" class="alert alert-info mb-3">
                <strong>Testing Redirect URI:</strong> <span id="current-uri"></span>
            </div>
            
            <button id="microsoft-login" class="microsoft-btn">
                <i class="fab fa-microsoft"></i>
                Login med Microsoft 365
            </button>
            
            <button id="try-next-uri" class="btn btn-secondary mt-2" style="width: 100%;">
                Try Next Redirect URI
            </button>
            
            <div class="loading-spinner">
                <i class="fas fa-spinner fa-spin"></i>
                Logger ind...
            </div>
            
            <div style="text-align: center; margin-top: 2rem; color: #666; font-size: 0.9rem;">
                <p>Log ind med din virksomheds Microsoft 365 konto</p>
            </div>
        </div>
    </div>

    <script>
        console.log('Login page script starting...');
        
        // MSAL Configuration
        // Common redirect URIs to test
        const possibleRedirectUris = [
            'http://localhost:5000/auth/callback',
            'http://localhost:5000',
            'https://localhost:5000/auth/callback', 
            'https://localhost:5000',
            window.location.origin + '/auth/callback',
            window.location.origin,
            window.location.href,
            'http://localhost:8080/auth/callback',
            'http://localhost:3000/auth/callback'
        ];

        let currentUriIndex = 0;
        
        function getCurrentRedirectUri() {
            return possibleRedirectUris[currentUriIndex];
        }

        const msalConfig = {
            auth: {
                clientId: '{{ azure_client_id }}',
                authority: 'https://login.microsoftonline.com/{{ azure_tenant_id }}',
                redirectUri: getCurrentRedirectUri()
            },
            cache: {
                cacheLocation: "localStorage",
                storeAuthStateInCookie: false,
            }
        };

        const msalInstance = new msal.PublicClientApplication(msalConfig);
        const loginRequest = {
            scopes: ["User.Read"]
        };

        // Update URI display
        function updateUriDisplay() {
            document.getElementById('current-uri').textContent = getCurrentRedirectUri();
            console.log('Current redirect URI:', getCurrentRedirectUri());
        }

        // Initialize login functionality
        function initializeLogin() {
            console.log('Initializing login...');
            
            const loginButton = document.getElementById('microsoft-login');
            const tryNextUriButton = document.getElementById('try-next-uri');
            const errorDiv = document.getElementById('error-message');
            const loadingSpinner = document.querySelector('.loading-spinner');
            
            // Update URI display
            updateUriDisplay();
            
            console.log('Login button found:', !!loginButton);

            function showError(message) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
            }

            function showLoading() {
                if (loginButton) loginButton.disabled = true;
                loadingSpinner.style.display = 'block';
            }

            function hideLoading() {
                if (loginButton) loginButton.disabled = false;
                loadingSpinner.style.display = 'none';
            }

            // Try next URI handler
            if (tryNextUriButton) {
                tryNextUriButton.addEventListener('click', function(e) {
                    e.preventDefault();
                    currentUriIndex = (currentUriIndex + 1) % possibleRedirectUris.length;
                    updateUriDisplay();
                    
                    // Update MSAL config with new URI
                    msalConfig.auth.redirectUri = getCurrentRedirectUri();
                    
                    showError('Redirect URI changed to: ' + getCurrentRedirectUri());
                    setTimeout(() => {
                        errorDiv.style.display = 'none';
                    }, 3000);
                });
            }

            // Microsoft login handler
            if (loginButton) {
                console.log('Adding Microsoft login handler');
                loginButton.addEventListener('click', async function(e) {
                    e.preventDefault();
                    showLoading();
                    errorDiv.style.display = 'none';
                    
                    try {
                        const loginResponse = await msalInstance.loginPopup(loginRequest);
                        console.log('Login successful:', loginResponse);
                        
                        if (loginResponse.accessToken) {
                            localStorage.setItem('access_token', loginResponse.accessToken);
                            localStorage.setItem('user_info', JSON.stringify(loginResponse.account));
                            window.location.href = '/dashboard';
                        } else {
                            showError('Login lykkedes, men ingen adgangstoken blev modtaget.');
                        }
                    } catch (error) {
                        console.error('Login failed:', error);
                        showError('Login fejlede: ' + (error.message || 'Ukendt fejl'));
                    } finally {
                        hideLoading();
                    }
                });
            }
        }

        // Check for logout parameter
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('logout') === 'true') {
            localStorage.removeItem('access_token');
            localStorage.removeItem('user_info');
            
            const logoutMessage = document.createElement('div');
            logoutMessage.className = 'alert alert-info';
            logoutMessage.textContent = 'Du er nu logget ud.';
            document.querySelector('.login-card').insertBefore(logoutMessage, document.getElementById('microsoft-login'));
            
            setTimeout(() => {
                logoutMessage.remove();
            }, 3000);
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM ready, initializing login...');
            initializeLogin();
        });

        // Check if already logged in (only for production mode)
        window.addEventListener('load', async () => {
            {% if not is_development %}
            try {
                await msalInstance.initialize();
                const accounts = msalInstance.getAllAccounts();
                
                if (accounts.length > 0) {
                    try {
                        const silentRequest = {
                            ...loginRequest,
                            account: accounts[0]
                        };
                        const tokenResponse = await msalInstance.acquireTokenSilent(silentRequest);
                        
                        localStorage.setItem('access_token', tokenResponse.accessToken);
                        localStorage.setItem('user_info', JSON.stringify(tokenResponse.account));
                        window.location.href = '/dashboard';
                    } catch (silentError) {
                        console.log('Silent token acquisition failed:', silentError);
                    }
                }
            } catch (error) {
                console.error('Initialization failed:', error);
            }
            {% endif %}
        });
    </script>
</body>
</html>
